name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
      - "docker-compose.yml"
      - "nginx/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
      - "docker-compose.yml"
      - "nginx/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # ========================================================
  # Job 1: Lint & Automated Tests (CI)
  # ========================================================
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint check (Ruff)
        run: |
          ruff check app tests || echo "Lint warnings found (non-blocking)"

      - name: Run Test Suite (Pytest)
        run: |
          pytest -v tests/

  # ========================================================
  # Job 2: Publish to GitHub Container Registry (CD)
  # ========================================================
  publish:
    name: Publish Container Image to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Job 4: Deploy to Production Server (CD)
  # ========================================================
  deploy:
    name: Deploy to Server
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment configuration
        run: |
          echo "Image pushed successfully to GitHub Container Registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::notice ::No DEPLOY_HOST secret set. Container image is published to GHCR and ready for deployment."
          else
            echo "Deployment target configured. Initiating remote deploy..."
          fi

      - name: Deploy via SSH (if credentials configured)
        if: "${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/trade-consult-website || cd ~/trade-consult-website
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend
            docker compose up -d backend
            docker system prune -f

      - name: Deploy via Webhook (if configured)
        if: "${{ secrets.DEPLOY_WEBHOOK_URL != '' }}"
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"}'
