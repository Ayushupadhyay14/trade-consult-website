version: "3.8"

services:
  # ==========================================
  # FastAPI Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade_consult_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_NAME=${PROJECT_NAME:-AlphaInsiight API}
      - SECRET_KEY=${SECRET_KEY:-insecure-default-change-in-production}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:3010}
      - ADMIN_PHONE=${ADMIN_PHONE:-9999999999}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@alphainsiight.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-ChangeMe123!}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY:-}
      - MSG91_SENDER_ID=${MSG91_SENDER_ID:-}
      - MSG91_TEMPLATE_ID=${MSG91_TEMPLATE_ID:-}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - RUN_SEED=${RUN_SEED:-true}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    volumes:
      - backend_uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trade_consult_net

  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: trade_consult_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trade_consult}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trade_consult}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trade_consult_net

  # ==========================================
  # Redis Cache & Message Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: trade_consult_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trade_consult_net

  # ==========================================
  # Nginx Reverse Proxy (Optional, for reverse proxy & WS)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: trade_consult_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - trade_consult_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  trade_consult_net:
    driver: bridge
